<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - We Care Pathlabs</title><link rel="icon" href="logo.svg">
<style>
:root{--d:#0a2a21;--g:#1b6b52;--y:#ffc928;--ink:#1d1d1d}*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--d);color:#fff}
.bga{position:absolute;bottom:0}.bga svg{width:100%;height:100%}
header{background:var(--g);box-shadow:0 3px 0 var(--y);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
main{max-width:950px;margin:0 auto;padding:14px}.box{background:rgba(244,247,245,.97);color:var(--ink);border-radius:14px;padding:14px;margin-bottom:14px}h2{margin:0 0 10px;color:var(--g)}
input,textarea,select{padding:8px;border:1px solid #b9c5bf;border-radius:8px;font:inherit;width:100%;margin:3px 0}input[type=checkbox]{width:auto}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:center;border-top:1px solid #d5ddd9;padding:10px 0}
button{background:var(--y);border:0;border-radius:20px;padding:8px 14px;font-weight:700;cursor:pointer}button.r{background:#d9534f;color:#fff}
a{color:#fff}#msg{color:var(--y);padding:6px 16px;min-height:30px}small{color:#667}
</style></head><body>
<div style="position:fixed;inset:0;z-index:-1;opacity:.16;pointer-events:none"><div class="bga" id="b1" style="right:2%;height:72%;width:34%"></div><div class="bga" id="b2" style="left:2%;height:46%;width:30%"></div></div>
<header><b>We Care Pathlabs - Admin</b><a href="index.html">View site</a></header><div id="msg"></div><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="art.js"></script>
<script>
const $=id=>document.getElementById(id),app=$("app"),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
document.body.style.background="linear-gradient(#0a2a21e8,#0a2a21e8),url('images/doctor.jpg') center/cover fixed";
const note=m=>{$("msg").textContent=m;setTimeout(()=>$("msg").textContent="",4000)},num=v=>v===""?null:Number(v);
if(typeof SUPABASE_URL==="undefined"||!SUPABASE_URL.startsWith("http")){app.innerHTML='<div class="box">Open config.js and paste your Supabase URL and anon key.</div>';throw 0}
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const K=["offer","new","info","notice"],kopt=v=>K.map(k=>`<option ${k==v?"selected":""}>${k}</option>`).join("");
function login(){app.innerHTML=`<div class="box"><h2>Admin login</h2><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Password"><br><button onclick="doLogin()">Login</button></div>`}
async function doLogin(){const{error}=await sb.auth.signInWithPassword({email:$("e").value,password:$("p").value});error?note(error.message):panel()}
async function panel(){const{data}=await sb.auth.getSession();if(!data.session)return login();
app.innerHTML=`<div class="box"><button onclick="annTab()">Announcements</button> <button onclick="testTab()">Tests &amp; Rates</button> <button onclick="setTab()">Contact info</button> <button class="r" onclick="sb.auth.signOut().then(login)">Logout</button></div><div id="view"></div>`;annTab()}
async function annTab(){const{data}=await sb.from("announcements").select("*").order("created_at",{ascending:false});
$("view").innerHTML=`<div class="box"><h2>Announcements (slideshow + popup feed)</h2><div class="row"><input id="na" placeholder="e.g. Thyroid test 20% OFF this week"><select id="nk">${kopt("offer")}</select><input id="ni" placeholder="Photo link (optional)"><button onclick="addAnn()">Post</button></div>
${(data||[]).map(a=>`<div class="row"><input id="a${a.id}" value="${esc(a.text)}"><select id="k${a.id}">${kopt(a.kind)}</select><input id="m${a.id}" placeholder="Photo link" value="${esc(a.image_url)}"><label><input type="checkbox" id="c${a.id}" ${a.active?"checked":""}> Show</label><div><button onclick="saveAnn(${a.id})">Save</button> <button class="r" onclick="del('announcements',${a.id},annTab)">Delete</button></div></div>`).join("")}</div>`}
async function addAnn(){if(!$("na").value.trim())return;const{error}=await sb.from("announcements").insert({text:$("na").value,kind:$("nk").value,image_url:$("ni").value||null});note(error?error.message:"Posted");annTab()}
async function saveAnn(i){const{error}=await sb.from("announcements").update({text:$("a"+i).value,kind:$("k"+i).value,image_url:$("m"+i).value||null,active:$("c"+i).checked}).eq("id",i);note(error?error.message:"Saved")}
async function testTab(){const{data}=await sb.from("tests").select("*").order("id");
$("view").innerHTML=`<datalist id="cl">${["Packages","Hematology","Biochemistry","Hormones & Vitamins","Infection","Clinical Pathology","Histopathology","Tumor Markers"].map(c=>`<option>${c}</option>`).join("")}</datalist>
<div class="box"><h2>Add test / package</h2><input id="nn" placeholder="Name"><input id="nc" list="cl" placeholder="Category"><textarea id="nd" placeholder="Short description"></textarea><input id="np" type="number" placeholder="Price"><input id="no" type="number" placeholder="Offer price (optional)"><button onclick="addTest()">Add</button></div>
<div class="box"><h2>Rates &amp; offers</h2><small>Empty price = "Call for rate". Type a Discount % and Save to set the offer price automatically. Clear offer price to remove an offer. Untick "Show on site" to hide a test.</small>${(data||[]).map(x=>`<div class="row"><div><input id="n${x.id}" value="${esc(x.name)}"><input id="g${x.id}" list="cl" value="${esc(x.category)}"><textarea id="d${x.id}">${esc(x.description)}</textarea><textarea id="t${x.id}" placeholder="Long details for the checkup page (optional)">${esc(x.details)}</textarea></div>
<div>Price<input id="p${x.id}" type="number" value="${x.price??""}">Offer price<input id="o${x.id}" type="number" value="${x.offer_price??""}">Discount %<input id="x${x.id}" type="number" placeholder="e.g. 20"></div>
<div><label><input type="checkbox" id="f${x.id}" ${x.featured?"checked":""}> Popular</label><br><label><input type="checkbox" id="v${x.id}" ${x.active?"checked":""}> Show on site</label></div>
<div><button onclick="saveTest(${x.id})">Save</button> <button class="r" onclick="del('tests',${x.id},testTab)">Delete</button></div></div>`).join("")}</div>`}
async function addTest(){const{error}=await sb.from("tests").insert({name:$("nn").value,category:$("nc").value||"Other",description:$("nd").value,price:num($("np").value),offer_price:num($("no").value)});note(error?error.message:"Added");testTab()}
async function saveTest(i){const p=num($("p"+i).value),x=num($("x"+i).value);let o=num($("o"+i).value);if(x!=null&&p!=null)o=Math.round(p*(100-x)/100);
const{error}=await sb.from("tests").update({name:$("n"+i).value,category:$("g"+i).value,description:$("d"+i).value,details:$("t"+i).value||null,price:p,offer_price:o,featured:$("f"+i).checked,active:$("v"+i).checked}).eq("id",i);note(error?error.message:"Saved");if(!error)testTab()}
async function del(t,id,back){if(!confirm("Delete this?"))return;await sb.from(t).delete().eq("id",id);back()}
async function setTab(){const{data}=await sb.from("settings").select("*"),o={};(data||[]).forEach(r=>o[r.key]=r.value);
$("view").innerHTML=`<div class="box"><h2>Contact info</h2>Phone<input id="s1" value="${esc(o.phone)}">Email<input id="s2" value="${esc(o.email)}">Address<textarea id="s3">${esc(o.address)}</textarea><button onclick="saveSet()">Save</button></div>`}
async function saveSet(){const{error}=await sb.from("settings").upsert([{key:"phone",value:$("s1").value},{key:"email",value:$("s2").value},{key:"address",value:$("s3").value}]);note(error?error.message:"Saved")}
panel();
</script></body></html>
