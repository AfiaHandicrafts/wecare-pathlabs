<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin - We Care Pathlabs</title><link rel="icon" href="logo.svg">
<style>
:root{--d:#0a2a21;--g:#1b6b52;--g2:#2e9d77;--y:#ffc928;--ink:#1d1d1d;--ln:#d5ddd9}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,"Segoe UI",Arial,sans-serif;background:linear-gradient(#0a2a21ee,#0a2a21ee),url(images/doctor.jpg) center/cover fixed #0a2a21;color:#fff;min-height:100vh;overflow-x:hidden}
@media(hover:none){body{background-attachment:scroll}}
header{background:var(--g);box-shadow:0 3px 0 var(--y);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
header img{height:36px}header b{flex:1;font-size:1.05rem}header a{color:#fff;font-size:.85rem}
nav{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;max-width:1000px;margin:0 auto}
nav button{flex:none;background:#ffffff14;color:#fff;border:1px solid #ffffff30;border-radius:22px;padding:9px 16px;font-weight:700;cursor:pointer;position:relative;font:inherit;font-weight:700}
nav button span{margin-right:6px}nav button.on{background:var(--y);color:var(--ink)}
.bd{position:absolute;top:-6px;right:-4px;background:#d62839;color:#fff;border-radius:10px;font-size:.7rem;padding:1px 6px;font-style:normal}
@media(max-width:700px){nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#061a14f2;border-top:2px solid var(--y);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;max-width:none;gap:0}
nav button{background:none;border:0;border-radius:10px;padding:6px 8px;font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:2px}nav button span{font-size:1.3rem;margin:0}nav button.on{background:#ffffff1f;color:var(--y)}main{padding-bottom:90px!important}}
main{max-width:1000px;margin:0 auto;padding:6px 14px 30px}
.box{background:rgba(244,247,245,.97);color:var(--ink);border-radius:16px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;color:var(--g);font-size:1.15rem}
input,textarea,select{padding:10px;border:1px solid #b9c5bf;border-radius:10px;font:inherit;font-size:16px;width:100%;margin:3px 0}input[type=checkbox]{width:auto;margin:0 6px 0 0}
label.k{font-size:.78rem;font-weight:700;color:#556;display:block;margin-top:6px}small{color:#667}
.b{background:var(--y);border:0;border-radius:20px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:.9rem;color:var(--ink);text-decoration:none;display:inline-block}.b.r{background:#d9534f;color:#fff}.b.gr{background:var(--g2);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.card{border:1px solid var(--ln);border-left:5px solid var(--g2);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}.card.new{border-left-color:var(--y);background:#fffbe8}
.th{width:54px;height:54px;border-radius:10px;background:#cfd8d4 center/cover;flex:none}
details.t{border:1px solid var(--ln);border-radius:12px;margin-bottom:8px;background:#fff}details.t>summary{display:flex;gap:10px;align-items:center;padding:10px;cursor:pointer;list-style:none}details.t>summary::-webkit-details-marker{display:none}details.t .in{padding:0 12px 12px}
.pill{font-size:.68rem;padding:2px 8px;border-radius:10px;background:#e2e5e9;font-weight:700}.pill.y{background:var(--y)}.pill.x{background:#f3c0c0}
#toast{position:fixed;top:60px;right:10px;width:min(92vw,330px);z-index:50;pointer-events:none}
.tk{background:#000d;border-left:5px solid var(--y);border-radius:8px;padding:10px 12px;margin-bottom:6px;animation:in .35s;color:#fff;font-size:.88rem;pointer-events:auto;cursor:pointer}.tk b{color:var(--y);display:block;font-size:.7rem;letter-spacing:1.5px}
@keyframes in{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}
#msg{color:var(--y);padding:4px 16px;min-height:24px;text-align:center;font-weight:700}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.ph .card{margin:0;text-align:center;padding:8px}.ph .big{height:100px;border-radius:10px;background:#cfd8d4 center/cover;margin-bottom:6px}
</style></head><body>
<div id="toast"></div><input type="file" id="pf" accept="image/*" style="display:none">
<header><img src="logo.svg" alt=""><b>We Care Admin</b><a href="index.html" target="_blank">View site</a><button class="b r" id="lo" style="display:none" onclick="logout()">Logout</button></header>
<nav id="nav" style="display:none"></nav><div id="msg"></div><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id),app=$("app"),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const note=m=>{$("msg").textContent=m;clearTimeout(note.t);note.t=setTimeout(()=>$("msg").textContent="",4500)},num=v=>(v===""||v==null)?null:Number(v);
if(typeof SUPABASE_URL==="undefined"||!SUPABASE_URL.startsWith("http")){app.innerHTML='<div class="box">Open config.js and paste your Supabase URL and anon key.</div>';throw 0}
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let view="inbox",lastId=0,poll,ifl="new",TESTS=[],IMGMAP={},tq="",tc="",openId=0,cap={};
const waNum=p=>{const d=String(p).replace(/\D/g,"");return d.length==10?"91"+d:d};
const KW=[["senior|elder","senior"],["pregnancy test","pregtest"],["pregnan|women|woman","woman"],["hba1c","hba1c"],["diabet|sugar|glucose","glucose"],["lipid","lipid"],["heart|cardiac","heart"],["thyroid|tsh","thyroid"],["vitamin|iron|anaem|b12|ferritin","vitamin"],["urine|stool","urine"],["dengue","dengue"],["malaria","malaria"],["hiv","hiv"],["culture","culture"],["widal|typhoid|crp|hepatitis|fever","microscope"],["liver|kidney|uric|electrolyte","tubes"],["cbc|complete blood","cbc"],["esr","esr"],["platelet","platelets"],["blood group","bloodgroup"],["inr","inr"],["hemoglobin","bloodtest"],["biopsy|fnac|pap smear|psa|ca-125","pathologist"],["men's|male","doctor"],["full body|checkup|health|package|employment","checkup"]];
const slotOf=x=>{const n=(x.name+" "+x.category).toLowerCase();for(const[k,v]of KW)if(new RegExp(k).test(n))return v;return "lab"};
const thumb=x=>x.image_url||IMGMAP[slotOf(x)]||"images/"+slotOf(x)+".jpg";
const SL=[["lab","Lab machine"],["tubes","Test tubes"],["tray","Sample tray"],["microscope","Microscope"],["doctor","Doctor"],["pathologist","Lab technician"],["bloodtest","Blood draw"],["patient","Happy patient"],["checkup","Checkup"],["glucose","Diabetes / sugar"],["heart","Heart"],["thyroid","Thyroid"],["vitamin","Vitamins"],["urine","Urine / stool"],["woman","Women's health"],["senior","Senior citizen"],["cbc","CBC"],["esr","ESR"],["platelets","Platelets"],["bloodgroup","Blood group"],["inr","PT / INR"],["hba1c","HbA1c"],["lipid","Lipid / cholesterol"],["dengue","Dengue"],["malaria","Malaria"],["hiv","HIV"],["culture","Culture"],["pregtest","Pregnancy test"]];
function newCap(){cap={a:Math.floor(Math.random()*9)+1,b:Math.floor(Math.random()*9)+1};if($("cq"))$("cq").textContent=cap.a+" + "+cap.b+" = ?"}
function login(){app.innerHTML=`<div class="box" style="max-width:380px;margin:8vh auto 0"><div style="text-align:center;font-size:2.4rem">&#128274;</div><h2 style="text-align:center">Admin login</h2><label class="k">Email</label><input id="e" type="email" placeholder="Email" autocomplete="username"><label class="k">Password</label><div style="position:relative"><input id="p" type="password" placeholder="Password" autocomplete="current-password" style="padding-right:48px" onkeydown="if(event.key==='Enter')doLogin()"><button type="button" id="eye" onclick="toggleEye()" style="position:absolute;right:4px;top:6px;background:none;border:0;font-size:1.2rem;padding:4px 8px;cursor:pointer">&#128065;</button></div><label class="k">Security question: <b id="cq"></b></label><input id="cv" type="number" placeholder="Your answer" onkeydown="if(event.key==='Enter')doLogin()"><br><button class="b" onclick="doLogin()" style="width:100%;padding:12px">Login</button></div>`;newCap()}
function toggleEye(){const p=$("p"),h=p.type=="password";p.type=h?"text":"password";$("eye").innerHTML=h?"&#128584;":"&#128065;"}
async function doLogin(){if(+$("cv").value!==cap.a+cap.b){note("Wrong answer to the security question");newCap();$("cv").value="";return}const{error}=await sb.auth.signInWithPassword({email:($("e").value.includes("@")?$("e").value.trim():$("e").value.trim()+"@gmail.com").toLowerCase(),password:$("p").value});if(error){note(error.message);newCap();$("cv").value=""}else panel()}
async function logout(){clearInterval(poll);await sb.auth.signOut();$("nav").style.display="none";$("lo").style.display="none";login()}
async function panel(){const{data}=await sb.auth.getSession();if(!data.session)return login();$("nav").style.display="flex";$("lo").style.display="";
$("nav").innerHTML=[["inbox","&#128229;","Inbox"],["slides","&#128226;","Slides"],["tests","&#129514;","Tests"],["photos","&#128444;","Photos"],["settings","&#9881;","Settings"]].map(a=>`<button id="n-${a[0]}" onclick="go('${a[0]}')"><span>${a[1]}</span>${a[2]}${a[0]=="inbox"?'<i class="bd" id="bd" style="display:none"></i>':""}</button>`).join("");
const r=await sb.from("appointments").select("id").order("id",{ascending:false}).limit(1);lastId=r.data&&r.data[0]?r.data[0].id:0;badge();clearInterval(poll);poll=setInterval(check,20000);go("inbox")}
function go(v){view=v;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.id=="n-"+v));({inbox,slides,tests,photos,settings})[v]()}
async function check(){const r=await sb.from("appointments").select("*").gt("id",lastId).order("id");if(r.error||!r.data||!r.data.length)return;r.data.forEach(a=>{toast(a);lastId=Math.max(lastId,a.id)});badge();if(view=="inbox")inbox()}
function toast(a){const d=document.createElement("div");d.className="tk";d.innerHTML=`<b>&#128197; NEW APPOINTMENT</b>${esc(a.first_name)} ${esc(a.last_name||"")} - ${esc(a.appt_date)} ${esc(a.appt_time)}${a.test_name?"<br>"+esc(a.test_name):""}`;d.onclick=()=>{go("inbox");d.remove()};$("toast").prepend(d);setTimeout(()=>d.remove(),12000);try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
async function badge(){const r=await sb.from("appointments").select("id",{count:"exact",head:true}).eq("status","new");const n=r.count||0,b=$("bd");if(b){b.textContent=n;b.style.display=n?"":"none"}document.title=(n?"("+n+") ":"")+"Admin - We Care Pathlabs"}
async function inbox(){const r=await sb.from("appointments").select("*").order("id",{ascending:false}).limit(200);
if(r.error){app.innerHTML=`<div class="box">Could not load the inbox: ${esc(r.error.message)}<br>Did you run the new SQL in Supabase?</div>`;return}
const all=r.data||[],st=a=>a.status||"new",l=ifl=="all"?all:all.filter(a=>st(a)==ifl),cnt=f=>f=="all"?all.length:all.filter(a=>st(a)==f).length;
app.innerHTML=`<div class="box"><h2>&#128229; Appointment inbox</h2><div class="row" style="margin-bottom:10px">${["new","done","all"].map(f=>`<button class="b ${f==ifl?"":"gr"}" onclick="ifl='${f}';inbox()">${f[0].toUpperCase()+f.slice(1)} (${cnt(f)})</button>`).join("")}<button class="b" onclick="inbox();badge()">&#8635; Refresh</button></div>
${l.length?l.map(a=>{const t=new Date(a.created_at).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}),wm=encodeURIComponent("Hello "+a.first_name+", this is We Care Pathlabs. We received your appointment request for "+a.appt_date+" at "+a.appt_time+".");
return `<div class="card ${st(a)=="new"?"new":""}"><b>${esc(a.first_name)} ${esc(a.last_name||"")}</b> <span class="pill">${esc(st(a))}</span><br>&#128222; ${esc(a.phone)}${a.email?" &bull; "+esc(a.email):""}<br>&#128197; <b>${esc(a.appt_date)}</b> at <b>${esc(a.appt_time)}</b>${a.test_name?"<br>&#129514; "+esc(a.test_name):""}${a.message?"<br>&#128172; "+esc(a.message):""}<br><small>Received ${t}</small>
<div class="row" style="margin-top:8px"><a class="b" href="tel:${esc(a.phone)}">Call</a><a class="b gr" target="_blank" rel="noopener" href="https://wa.me/${waNum(a.phone)}?text=${wm}">WhatsApp</a><button class="b" onclick="setSt(${a.id},'${st(a)=="new"?"done":"new"}')">${st(a)=="new"?"&#10003; Mark done":"Reopen"}</button><button class="b r" onclick="delRow('appointments',${a.id},inbox)">Delete</button></div></div>`}).join(""):"<p>No appointments here yet.</p>"}</div>`}
async function setSt(id,s){const{error}=await sb.from("appointments").update({status:s}).eq("id",id);note(error?error.message:"Updated");inbox();badge()}
async function delRow(t,id,back){if(!confirm("Delete this?"))return;const{error}=await sb.from(t).delete().eq("id",id);note(error?error.message:"Deleted");back();badge()}
const KS=["offer","new","info","notice"],ko=v=>KS.map(k=>`<option ${k==v?"selected":""}>${k}</option>`).join("");
async function slides(){const{data}=await sb.from("announcements").select("*").order("created_at",{ascending:false});
app.innerHTML=`<div class="box"><h2>&#128226; Slides &amp; announcements</h2><small>Each one is a photo slide on the home page and a popup. Leave the photo link empty to use a default photo.</small>
<label class="k">Slide text</label><input id="na" placeholder="e.g. Thyroid test 20% OFF this week"><div class="g2"><div><label class="k">Type</label><select id="nk">${ko("offer")}</select></div><div><label class="k">Photo link (optional)</label><input id="ni" placeholder="https://..."></div></div><br><button class="b" onclick="addAnn()">Post slide</button></div>
<div class="box">${(data||[]).map(a=>`<div class="card"><label class="k">Slide text</label><input id="a${a.id}" value="${esc(a.text)}"><div class="g2"><div><label class="k">Type</label><select id="k${a.id}">${ko(a.kind)}</select></div><div><label class="k">Photo link</label><input id="m${a.id}" value="${esc(a.image_url)}"></div></div><div class="row" style="margin-top:8px"><label><input type="checkbox" id="c${a.id}" ${a.active?"checked":""}>Show</label><button class="b" onclick="saveAnn(${a.id})">Save</button><button class="b r" onclick="delRow('announcements',${a.id},slides)">Delete</button></div></div>`).join("")||"<p>No slides yet.</p>"}</div>`}
async function addAnn(){if(!$("na").value.trim())return;const{error}=await sb.from("announcements").insert({text:$("na").value,kind:$("nk").value,image_url:$("ni").value||null});note(error?error.message:"Posted");slides()}
async function saveAnn(i){const{error}=await sb.from("announcements").update({text:$("a"+i).value,kind:$("k"+i).value,image_url:$("m"+i).value||null,active:$("c"+i).checked}).eq("id",i);note(error?error.message:"Saved")}
async function tests(){const[a,b]=await Promise.all([sb.from("tests").select("*").order("id"),sb.from("site_images").select("*")]);TESTS=a.data||[];IMGMAP={};(b.data||[]).forEach(r=>IMGMAP[r.slot]=r.url);
const cats=[...new Set(["Packages","Hematology","Biochemistry","Hormones & Vitamins","Infection","Clinical Pathology","Histopathology","Tumor Markers",...TESTS.map(x=>x.category)])];
app.innerHTML=`<datalist id="cl">${cats.map(c=>`<option>${esc(c)}</option>`).join("")}</datalist>
<details class="box"><summary style="cursor:pointer;font-weight:800;color:var(--g)">&#10133; Add a new test / package</summary>
<label class="k">Test name</label><input id="nn" placeholder="e.g. Thyroid Profile"><label class="k">Category</label><input id="nc" list="cl" placeholder="Pick or type"><label class="k">Short description (card)</label><textarea id="nd" rows="2"></textarea><label class="k">Long details (checkup page)</label><textarea id="nl" rows="4"></textarea>
<div class="g2"><div><label class="k">Price (Rs)</label><input id="np" type="number" inputmode="decimal"></div><div><label class="k">Offer price (Rs)</label><input id="no" type="number" inputmode="decimal"></div></div>
<div class="row" style="margin:8px 0"><label><input type="checkbox" id="nf">Popular</label><label><input type="checkbox" id="nv" checked>Show on site</label></div><button class="b" onclick="addTest()">Add test</button></details>
<div class="box"><h2>&#129514; Tests, rates &amp; offers (${TESTS.length})</h2><div class="g2"><input id="fq" placeholder="Search tests..." oninput="tq=this.value;tlist()"><select id="fc" onchange="tc=this.value;tlist()"><option value="">All categories</option>${cats.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div><div id="tl" style="margin-top:8px"></div></div>`;tlist()}
function tlist(){const l=TESTS.filter(x=>(!tc||x.category==tc)&&(x.name+" "+x.category).toLowerCase().includes(tq.toLowerCase()));
$("tl").innerHTML=l.map(x=>`<details class="t" ${x.id==openId?"open":""}><summary><div class="th" style="background-image:url('${esc(thumb(x))}')"></div><div style="flex:1;min-width:0"><b>${esc(x.name)}</b><br><small>${esc(x.category)}</small></div><div style="text-align:right">${x.price==null?'<span class="pill">no price</span>':x.offer_price!=null?`<s style="color:#999">&#8377;${x.price}</s> <b>&#8377;${x.offer_price}</b>`:`<b>&#8377;${x.price}</b>`}<br>${x.featured?'<span class="pill y">Popular</span> ':""}${x.active?"":'<span class="pill x">Hidden</span>'}</div></summary><div class="in">
<label class="k">Test name</label><input id="n${x.id}" value="${esc(x.name)}"><label class="k">Category</label><input id="g${x.id}" list="cl" value="${esc(x.category)}">
<label class="k">Short description (shown on the card)</label><textarea id="d${x.id}" rows="2">${esc(x.description)}</textarea><label class="k">Long details (shown on the checkup page)</label><textarea id="t${x.id}" rows="4">${esc(x.details)}</textarea>
<div class="g2"><div><label class="k">Price (Rs)</label><input id="p${x.id}" type="number" inputmode="decimal" value="${x.price==null?"":x.price}"></div><div><label class="k">Offer price (Rs)</label><input id="o${x.id}" type="number" inputmode="decimal" value="${x.offer_price==null?"":x.offer_price}"></div><div><label class="k">Discount % (auto offer)</label><input id="x${x.id}" type="number" inputmode="decimal" placeholder="e.g. 20"></div></div>
<div class="row" style="margin:8px 0"><label><input type="checkbox" id="f${x.id}" ${x.featured?"checked":""}>Popular</label><label><input type="checkbox" id="v${x.id}" ${x.active?"checked":""}>Show on site</label></div>
<div class="row"><button class="b gr" onclick="pickPhoto('test',${x.id})">&#128444; Change photo</button>${x.image_url?`<button class="b" onclick="clearTestPhoto(${x.id})">Default photo</button>`:""}<button class="b" onclick="saveTest(${x.id})">Save</button><button class="b r" onclick="delRow('tests',${x.id},tests)">Delete</button></div></div></details>`).join("")||"<p>No tests match.</p>"}
async function addTest(){if(!$("nn").value.trim()){note("Enter a test name");return}const{error}=await sb.from("tests").insert({name:$("nn").value.trim(),category:$("nc").value||"Other",description:$("nd").value,details:$("nl").value||null,price:num($("np").value),offer_price:num($("no").value),featured:$("nf").checked,active:$("nv").checked});note(error?error.message:"Added");tests()}
async function saveTest(i){const p=num($("p"+i).value),d=num($("x"+i).value);let o=num($("o"+i).value);if(d!=null&&p!=null)o=Math.round(p*(100-d)/100);openId=i;
const{error}=await sb.from("tests").update({name:$("n"+i).value,category:$("g"+i).value,description:$("d"+i).value,details:$("t"+i).value||null,price:p,offer_price:o,featured:$("f"+i).checked,active:$("v"+i).checked}).eq("id",i);note(error?error.message:"Saved");if(!error)tests()}
async function clearTestPhoto(i){openId=i;const{error}=await sb.from("tests").update({image_url:null}).eq("id",i);note(error?error.message:"Back to default photo");tests()}
function loadImg(f){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)})}
async function upload(file,name){const img=await loadImg(file),r=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
const blob=await new Promise(res=>c.toBlob(res,"image/jpeg",.82)),path=name+"-"+Date.now()+".jpg",{error}=await sb.storage.from("site-photos").upload(path,blob,{contentType:"image/jpeg",upsert:true});if(error)throw error;return sb.storage.from("site-photos").getPublicUrl(path).data.publicUrl}
function pickPhoto(kind,key){const f=$("pf");f.dataset.kind=kind;f.dataset.key=key;f.value="";f.click()}
$("pf").onchange=async function(){const f=this.files[0];if(!f)return;const kind=this.dataset.kind,key=this.dataset.key;note("Uploading photo...");
try{const url=await upload(f,kind=="test"?"test"+key:key);
if(kind=="test"){openId=+key;const{error}=await sb.from("tests").update({image_url:url}).eq("id",key);if(error)throw error;note("Photo changed");tests()}
else{const{error}=await sb.from("site_images").upsert({slot:key,url});if(error)throw error;note("Photo changed on the live site");photos()}}
catch(e){note("Upload failed: "+(e.message||e))}};
async function photos(){const b=await sb.from("site_images").select("*");IMGMAP={};(b.data||[]).forEach(r=>IMGMAP[r.slot]=r.url);
app.innerHTML=`<div class="box"><h2>&#128444; Site photos</h2><small>All the shared photos used on the site. Tap Change to upload a new one from your phone or laptop; it updates the live site for everyone. Reset brings back the original. Photos for one particular test are changed in the Tests tab.</small></div>
<div class="ph">${SL.map(s=>`<div class="card"><div class="big" style="background-image:url('${esc(IMGMAP[s[0]]||"images/"+s[0]+".jpg")}')"></div><b style="font-size:.85rem">${s[1]}</b><br><small>${IMGMAP[s[0]]?"custom":"original"}</small><div class="row" style="justify-content:center;margin-top:6px"><button class="b gr" onclick="pickPhoto('slot','${s[0]}')">Change</button>${IMGMAP[s[0]]?`<button class="b" onclick="resetSlot('${s[0]}')">Reset</button>`:""}</div></div>`).join("")}</div>`}
async function resetSlot(k){const{error}=await sb.from("site_images").delete().eq("slot",k);note(error?error.message:"Photo reset");photos()}
async function settings(){const{data}=await sb.from("settings").select("*"),o={};(data||[]).forEach(r=>o[r.key]=r.value);
const F=[["phone","Phone"],["email","E-mail (full address; the site shows only the part before @)"],["address","Address"],["hours_days","Working days"],["hours_time","Timings (e.g. 7 AM - 9 PM)"],["hours_emergency","Emergency service text"],["hours_note","Extra note (e.g. home collection)"]];
app.innerHTML=`<div class="box"><h2>&#9881; Contact &amp; working hours</h2>${F.map(f=>`<label class="k">${f[1]}</label><input id="s_${f[0]}" value="${esc(o[f[0]])}">`).join("")}<br><button class="b" onclick="saveSet()">Save</button></div><div class="box"><h2>&#128273; Change admin password</h2><label class="k">New password (at least 8 characters)</label><input id="npw" type="password" autocomplete="new-password"><br><button class="b" onclick="chPw()">Change password</button></div>`}
async function saveSet(){const keys=["phone","email","address","hours_days","hours_time","hours_emergency","hours_note"];const{error}=await sb.from("settings").upsert(keys.map(k=>({key:k,value:$("s_"+k).value})));note(error?error.message:"Saved")}
async function chPw(){const v=$("npw").value;if(v.length<8){note("Use at least 8 characters");return}const{error}=await sb.auth.updateUser({password:v});note(error?error.message:"Password changed");$("npw").value=""}
panel();
</script></body></html>
